name: 'Hybrid RAG Issue & PR Assistant'
description: 'Context-grounded Hybrid RAG assistant for GitHub Issues and Pull Requests using GitHub Models.'
author: 'Cagrik34'
branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token used for GitHub Models inference and for posting responses to Issues and Pull Requests. Requires contents:read, issues:write, pull-requests:write, and models:read permissions.'
    required: true
    default: '${{ github.token }}'
  query-trigger:
    description: 'Trigger keyword to activate the assistant in issue/PR comments (e.g., "@rag-bot", "auto").'
    required: false
    default: 'auto'
  docs-path:
    description: 'Comma-separated repository relative paths or directories containing documentation to recursively index.'
    required: false
    default: 'README.md,action.yml,docs,CONTRIBUTING.md'
  model-name:
    description: 'GitHub Models model identifier (e.g., "Phi-4", "gpt-4o-mini").'
    required: false
    default: 'Phi-4'
  top-k:
    description: 'Number of top retrieved passages to fuse and supply in prompt context (integer between 1 and 100; capped at a 32,000-character context budget).'
    required: false
    default: '5'
  rrf-k:
    description: 'Reciprocal Rank Fusion constant (integer between 1 and 1000, default: 60).'
    required: false
    default: '60'

outputs:
  retrieved-chunks-count:
    description: 'Number of relevant chunks retrieved and fused.'
  response-status:
    description: 'Execution status of the assistant: "success" (GitHub Models inference succeeded), "fallback" (deterministic local fallback used), "skipped" (ignored trigger or unsupported event), or "failed" (unrecoverable error).'

runs:
  using: 'node24'
  main: 'dist/index.js'
