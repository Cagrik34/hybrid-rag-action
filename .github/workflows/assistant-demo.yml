name: 🤖 Hybrid RAG Self-Assistant

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  run-assistant:
    name: ⚡ Grounded AI Response
    runs-on: ubuntu-latest
    if: ${{ !github.event.issue.pull_request || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: 📥 Checkout Repository Context
        uses: actions/checkout@v4

      - name: 🚀 Run Local Hybrid RAG Action
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          docs-path: 'README.md,action.yml'
          query-trigger: 'auto'
          llm-provider: 'github-models'
          model-name: 'Phi-4'
