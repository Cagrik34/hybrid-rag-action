version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      npm-patches:
        patterns:
          - '*'
        update-types:
          - 'patch'
      npm-minors:
        patterns:
          - '*'
        update-types:
          - 'minor'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions-patches:
        patterns:
          - '*'
        update-types:
          - 'patch'
      actions-minors:
        patterns:
          - '*'
        update-types:
          - 'minor'
