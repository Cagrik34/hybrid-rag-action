name: 🛡️ Sunday Ecosystem Sentinel & Framework Compatibility Hunter

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ecosystem-sentinel
  cancel-in-progress: true

jobs:
  compatibility-check:
    name: 🔍 Framework Compatibility Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: 📥 Checkout Repository Context
        uses: actions/checkout@v7

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Install Latest Framework Packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install langchain llama-index dspy-ai haystack-ai dify-client pydantic --quiet

      - name: 🧪 Execute Ecosystem Adapter Compatibility Suite
        run: python -m unittest ecosystem.test_ecosystem_integrations

      - name: 🚨 Alert Maintainer on Compatibility Regression
        if: failure()
        uses: actions/github-script@v9
        env:
          SENTINEL_PYTHON_VERSION: ${{ matrix.python-version }}
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ [Automated Alert] Upstream Framework Compatibility Regression Detected',
              body: `### 🚨 Ecosystem Sentinel Alert

The automated weekly compatibility test failed on Python ${process.env.SENTINEL_PYTHON_VERSION}.

One of the integrated frameworks (LangChain, LlamaIndex, Dify, Haystack, or DSPy) may have released a breaking API change.

**Workflow Run:** [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            })
