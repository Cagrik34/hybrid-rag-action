name: 🚀 Hybrid RAG CI & Quality Matrix

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ecosystem/**'
      - 'test/**'
      - 'action.yml'
      - 'package.json'
      - 'package-lock.json'
      - '**/*.js'
      - '**/*.py'
      - '**/*.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'ecosystem/**'
      - 'test/**'
      - 'action.yml'
      - 'package.json'
      - 'package-lock.json'
      - '**/*.js'
      - '**/*.py'
      - '**/*.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    name: 🧪 CI Matrix (Node ${{ matrix.node-version }} + Py ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['20.x', '22.x']
        python-version: ['3.11', '3.12']

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install NPM Dependencies
        run: npm install

      - name: 🛡️ Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: ⚡ Run Node.js Core Retrieval Test Suite
        run: npm test

      - name: 🧪 Run Python Ecosystem Adapters Test Suite
        run: python -m unittest ecosystem.test_ecosystem_integrations
