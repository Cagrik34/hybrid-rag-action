name: 🚀 Hybrid RAG CI & Quality Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Validate & Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['24.x']
        python-version: ['3.12']

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Clean Install NPM Dependencies
        run: npm ci

      - name: 🛡️ Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: ⚡ Run Test Suite
        run: npm test

      - name: 🏗️ Rebuild Dist Bundle
        run: npm run build

      - name: 🔎 Syntax Check Distribution Bundle
        run: node --check dist/index.js

      - name: 🔍 Verify Dist is Clean and Committed
        run: git diff --exit-code dist/

      - name: 🧪 Run Python Ecosystem Adapters Test Suite
        run: python -m unittest ecosystem.test_ecosystem_integrations
