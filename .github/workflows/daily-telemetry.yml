name: Automated Daily Health & Benchmark Telemetry

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-telemetry
  cancel-in-progress: true

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Security Audit
        run: npm audit --audit-level=high

      - name: Run Test Suite
        run: npm test

      - name: Execute Benchmark Telemetry
        run: node scripts/benchmark-telemetry.js

      - name: Publish Benchmark Summary
        shell: bash
        run: |
          echo "## Automated Hybrid RAG Telemetry" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat telemetry/README.md >> "$GITHUB_STEP_SUMMARY"
