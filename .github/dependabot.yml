version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      npm-patches:
        patterns:
          - '*'
        update-types:
          - 'patch'
      npm-minors:
        patterns:
          - '*'
        update-types:
          - 'minor'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      actions-patches:
        patterns:
          - '*'
        update-types:
          - 'patch'
      actions-minors:
        patterns:
          - '*'
        update-types:
          - 'minor'
