name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in SemVer form, for example v1.0.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-preflight
  cancel-in-progress: false

jobs:
  validate-release:
    name: Release Preflight Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate requested version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION"
            exit 1
          fi

      - name: Verify release tag does not already exist
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_VERSION"
            exit 1
          fi

      - name: Verify package version matches release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_VERSION="${RELEASE_VERSION#v}"

          echo "Requested release: $RELEASE_VERSION"
          echo "Package version: v$PACKAGE_VERSION"

          if [[ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "package.json version does not match requested release version."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run Node.js tests
        run: npm test

      - name: Build distribution
        run: npm run build

      - name: Verify distribution syntax
        run: node --check dist/index.js

      - name: Verify distribution synchronization
        run: git diff --exit-code dist/

      - name: Run Python ecosystem tests
        run: python -m unittest ecosystem.test_ecosystem_integrations

      - name: Report verified target
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "Release candidate: $RELEASE_VERSION"
          echo "Verified commit: $(git rev-parse HEAD)"
