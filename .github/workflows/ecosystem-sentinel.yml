name: 🛡️ Sunday Ecosystem Sentinel & Framework Compatibility Hunter

on:
  schedule:
    # Every Sunday at 00:00 UTC (Runs autonomously in the cloud even when PC is off!)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compatibility-check:
    name: 🔍 Framework Compatibility Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: 📥 Checkout Repository Context
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Install Latest Framework Packages
        run: |
          python -m pip install --upgrade pip
          pip install langchain llama-index dspy-ai haystack-ai dify-client pydantic --quiet || true

      - name: 🧪 Execute Ecosystem Adapter Compatibility Suite
        id: test_ecosystem
        run: python -m unittest ecosystem.test_ecosystem_integrations

      - name: 🚨 Alert Maintainer on Compatibility Regression
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ [Automated Alert] Upstream Framework Compatibility Regression Detected',
              body: `### 🚨 Ecosystem Sentinel Alert\n\nThe automated weekly compatibility test failed on Python ${process.env.PYTHON_VERSION || '3.12'}.\n\nOne of the integrated frameworks (LangChain, LlamaIndex, Dify, Haystack, or DSPy) may have released a breaking API change.\n\n**Workflow Run:** [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            })
