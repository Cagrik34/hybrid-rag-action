identity:
  name: hybrid_rag_github_triage
  author: Cagrik34
  label:
    en_US: Hybrid RAG GitHub Triage
description:
  en_US: Zero-dependency hybrid lexical (BM25) and semantic retrieval tool for automated repository and PR triage.
parameters:
  - name: repository
    type: string
    required: true
    label:
      en_US: Repository Name (owner/repo)
  - name: query
    type: string
    required: true
    label:
      en_US: Issue or Question Query
  - name: top_k
    type: number
    required: false
    default: 5
    label:
      en_US: Maximum Top Results
  - name: documents
    type: array[object]
    required: false
    label:
      en_US: Custom Document Corpus
