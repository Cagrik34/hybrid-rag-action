name: 🚀 Hybrid RAG CI & Quality Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-validation:
    name: 🔎 Validate GitHub Actions Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 📦 Install actionlint v1.7.12
        shell: bash
        run: |
          set -euo pipefail

          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${ARCHIVE}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"

          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${ARCHIVE}" | sha256sum --check

          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" \
            -C "${RUNNER_TEMP}/actionlint" \
            actionlint

          echo "${RUNNER_TEMP}/actionlint" >> "$GITHUB_PATH"

      - name: 🔎 Validate All Workflow Files
        run: actionlint -color
  validate:
    name: 🧪 Validate & Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['24.x']
        python-version: ['3.12']

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Clean Install NPM Dependencies
        run: npm ci

      - name: 🛡️ Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: ⚡ Run Test Suite
        run: npm test

      - name: 🏗️ Rebuild Dist Bundle
        run: npm run build

      - name: 🔎 Syntax Check Distribution Bundle
        run: node --check dist/index.js

      - name: 🔍 Verify Dist is Clean and Committed
        run: git diff --exit-code dist/

      - name: 🧪 Run Python Ecosystem Adapters Test Suite
        run: python -m unittest ecosystem.test_ecosystem_integrations
